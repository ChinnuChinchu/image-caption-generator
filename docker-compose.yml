services:
  db:
    image: postgres:16
    container_name: caption_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: captionuser
      POSTGRES_PASSWORD: captionpass
      POSTGRES_DB: captiondb
    ports:
      # host port 5433 -> container port 5432
      # (5433 avoids a clash with any PostgreSQL already installed on Windows)
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U captionuser -d captiondb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
